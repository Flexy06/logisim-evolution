# Fork: custom FlatLaf defaults, applied on top of every FlatLaf theme
# (registered in Main via FlatLaf.registerCustomDefaultsSource("com.cburch.logisim.theme")).
# Reference of all keys: https://www.formdev.com/flatlaf/customizing/
# Add FlatDarkLaf.properties / FlatMacDarkLaf.properties next to this file for dark-only tweaks.

@accentColor = #4F6BED

#---- rounded corners ----
Component.arc = 10
Button.arc = 10
TextComponent.arc = 8
CheckBox.arc = 6
ProgressBar.arc = 999

#---- focus ----
Component.focusWidth = 1
Component.innerFocusWidth = 0

#---- menus & popups ----
MenuItem.selectionArc = 8
MenuItem.selectionInsets = 0,4,0,4
PopupMenu.borderCornerRadius = 10

#---- scrollbars: slim, no arrow buttons, pill-shaped ----
ScrollBar.showButtons = false
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,2,2,2

#---- tabs ----
TabbedPane.showTabSeparators = false
TabbedPane.tabSelectionHeight = 3
TabbedPane.tabHeight = 32
TabbedPane.tabArc = 8

#---- tables & trees ----
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
Tree.selectionArc = 8
Tree.selectionInsets = 0,2,0,2
List.selectionArc = 8

#---- split panes ----
SplitPane.dividerSize = 6
SplitPaneDivider.style = plain

#---- window title bar (Windows 10/11: menu bar embedded in title bar) ----
TitlePane.unifiedBackground = true
TitlePane.menuBarEmbedded = true

#---- toolbar ----
ToolBar.hoverButtonGroupArc = 10
